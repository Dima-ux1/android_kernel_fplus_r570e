name: Build Android Kernel

on:
  push:
    branches: [ main, master, lotus-4.9.205 ]
    paths:
      - 'arch/**'
      - 'kernel/**'
      - 'lib/**'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    branches: [ main, master, lotus-4.9.205 ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Kernel config (r570e_defconfig)'
        required: true
        default: 'r570e_defconfig'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabihf \
          libncurses5-dev \
          libssl-dev \
          bc \
          bison \
          flex \
          libelf-dev \
          libdw-dev \
          python3 \
          git
    
    - name: Clean kernel tree
      run: |
        make mrproper || true
    
    - name: Fix compilation errors
      run: |
        # Fix mtk_gpu_metmonitor.c memset error
        FILE="drivers/misc/mediatek/met/common/mtk_gpu_metmonitor.c"
        if [ -f "$FILE" ]; then
          sed -i 's/memset(pu4Value, 0x00, eMET_GPU_PROFILE_CNT);/memset(pu4Value, 0x00, eMET_GPU_PROFILE_CNT * sizeof(unsigned int));/g' "$FILE" || true
          echo "✓ Fixed mtk_gpu_metmonitor.c"
        fi
        
        # Fix fm_link.c uninitialized variable
        FILE="drivers/misc/mediatek/connectivity/fmradio/core/fm_link.c"
        if [ -f "$FILE" ]; then
          # Initialize len variable
          sed -i 's/signed int len;/signed int len = 0;/g' "$FILE" || true
          echo "✓ Fixed fm_link.c"
        fi
        
        # Fix wlan_lib.c uninitialized variable and memset errors
        FILE="drivers/misc/mediatek/connectivity/wlan/core/gen4m/common/wlan_lib.c"
        if [ -f "$FILE" ]; then
          # Initialize saveptr1
          sed -i 's/char \*saveptr1, \*saveptr2;/char *saveptr1 = NULL, *saveptr2 = NULL;/g' "$FILE" || true
          # Fix kalMemSet for apcArgv (array of pointers)
          sed -i 's/kalMemSet(apcArgv, 0, WLAN_CFG_ARGV_MAX);/kalMemSet(apcArgv, 0, WLAN_CFG_ARGV_MAX * sizeof(int8_t *));/g' "$FILE" || true
          # Fix kalMemSet for arcArgv_size (array of int8_t)
          sed -i 's/kalMemSet(arcArgv_size, 0, WLAN_CFG_ARGV_MAX);/kalMemSet(arcArgv_size, 0, WLAN_CFG_ARGV_MAX * sizeof(int8_t));/g' "$FILE" || true
          echo "✓ Fixed wlan_lib.c"
        fi
        
        # Fix wmt_plat_alps.c enum/integer mismatch
        FILE="drivers/misc/mediatek/connectivity/common/common_main/platform/wmt_plat_alps.c"
        if [ -f "$FILE" ]; then
          # Change parameter type from WMT_SDIO_SLOT_NUM to UINT32
          sed -i 's/INT32 wmt_plat_sdio_ctrl(WMT_SDIO_SLOT_NUM sdioPortType, ENUM_FUNC_STATE on)/INT32 wmt_plat_sdio_ctrl(UINT32 sdioPortNum, ENUM_FUNC_STATE on)/g' "$FILE" || true
          # Fix variable name in function body
          sed -i 's/board_sdio_ctrl(sdioPortType,/board_sdio_ctrl(sdioPortNum,/g' "$FILE" || true
          echo "✓ Fixed wmt_plat_alps.c"
        fi
        
        # Fix stp_core.c enum/integer mismatch
        FILE="drivers/misc/mediatek/connectivity/common/common_main/core/stp_core.c"
        if [ -f "$FILE" ]; then
          # Change parameter type from MTKSTP_PSM_ACTION_T to UINT32
          sed -i 's/INT32 mtk_wcn_stp_psm_notify_stp(const MTKSTP_PSM_ACTION_T action)/INT32 mtk_wcn_stp_psm_notify_stp(const UINT32 action)/g' "$FILE" || true
          # Add type cast for stp_psm_notify_stp call
          sed -i 's/stp_psm_notify_stp(STP_PSM_CORE(stp_core_ctx), action);/stp_psm_notify_stp(STP_PSM_CORE(stp_core_ctx), (MTKSTP_PSM_ACTION_T)action);/g' "$FILE" || true
          echo "✓ Fixed stp_core.c"
        fi
        
        # Fix gl_kal.c uninitialized variables
        FILE="drivers/misc/mediatek/connectivity/wlan/core/gen4m/os/linux/gl_kal.c"
        if [ -f "$FILE" ]; then
          # Initialize acBuf arrays (all occurrences)
          sed -i 's/char acBuf\[128 + 1\];\s*\/\* + 1 for "\\0" \*\//char acBuf[128 + 1] = {0}; \/* + 1 for "\\0" *\//g' "$FILE" || true
          sed -i 's/char acBuf\[128 + 1\];$/char acBuf[128 + 1] = {0};/g' "$FILE" || true
          echo "✓ Fixed gl_kal.c"
        fi
        
        # Fix gl_qa_agent.c memcpy bounds error
        FILE="drivers/misc/mediatek/connectivity/wlan/core/gen4m/os/linux/gl_qa_agent.c"
        if [ -f "$FILE" ]; then
          # Ensure u2Len is initialized
          sed -i 's/uint16_t u2Len;$/uint16_t u2Len = 0;/g' "$FILE" || true
          # Add u2Len calculation before kmalloc_array if it doesn't exist
          if ! grep -q "u2Len = ntohl(HqaCmdFrame->Length) - sizeof(u4SuMu);" "$FILE"; then
            sed -i '/DBGLOG(RFTEST, INFO, "QA_AGENT HQA_MUSetMUTable\\n");/a\
\
	u2Len = ntohl(HqaCmdFrame->Length) - sizeof(u4SuMu);' "$FILE" || true
          fi
          # Add check for u2Len == 0 before kmalloc_array if it doesn't exist
          if ! grep -B5 "kmalloc_array(u2Len" "$FILE" | grep -q "if (u2Len == 0)"; then
            sed -i '/u2Len = ntohl(HqaCmdFrame->Length) - sizeof(u4SuMu);/a\
	if (u2Len == 0) {\
		return -EINVAL;\
	}' "$FILE" || true
          fi
          # Add check for prTable == NULL after kmalloc_array if it doesn't exist
          if ! grep -A3 "kmalloc_array(u2Len, sizeof(uint8_t), GFP_KERNEL);" "$FILE" | grep -q "if (!prTable)"; then
            sed -i '/prTable = kmalloc_array(u2Len, sizeof(uint8_t), GFP_KERNEL);/a\
	if (!prTable) {\
		return -ENOMEM;\
	}' "$FILE" || true
          fi
          echo "✓ Fixed gl_qa_agent.c"
        fi
    
    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make ${{ github.event.inputs.config || 'r570e_defconfig' }}
    
    - name: Build kernel image only
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Build kernel image without modules first
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
    
    - name: Build kernel modules
      continue-on-error: true
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules 2>&1 | tee -a build.log || echo "⚠ Some modules failed to build, continuing..."
    
    - name: Install modules
      continue-on-error: true
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p modules
        make modules_install INSTALL_MOD_PATH=./modules INSTALL_MOD_STRIP=1 2>&1 | tee -a build.log || echo "⚠ Some modules failed to install, continuing..."
    
    - name: Check build artifacts
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✓ Kernel image built successfully"
          ls -lh arch/arm64/boot/Image.gz-dtb
        else
          echo "✗ Kernel image not found"
          exit 1
        fi
        if [ -d modules/lib/modules ]; then
          echo "✓ Kernel modules built successfully"
          find modules/lib/modules -name "*.ko" | wc -l | xargs echo "Total .ko files:"
          du -sh modules/lib/modules
        else
          echo "⚠ Kernel modules directory not found"
        fi
    
    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image
          .config
        retention-days: 30
    
    - name: Create modules archive
      if: success()
      run: |
        if [ -d modules/lib/modules ]; then
          cd modules
          tar -czf ../kernel-modules.tar.gz lib/
          cd ..
          echo "✓ Modules archive created"
          ls -lh kernel-modules.tar.gz
        else
          echo "⚠ No modules to archive"
        fi
    
    - name: Upload kernel modules
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: |
          kernel-modules.tar.gz
          modules/lib/modules/
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
    
    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel Image:** \`arch/arm64/boot/Image.gz-dtb\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(ls -lh arch/arm64/boot/Image.gz-dtb | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check build log for details." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d modules/lib/modules ]; then
          MODULE_COUNT=$(find modules/lib/modules -name "*.ko" | wc -l)
          echo "**Kernel Modules:** ✅ ($MODULE_COUNT .ko files)" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Archive:** \`kernel-modules.tar.gz\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Kernel Modules:** ⚠ Not found" >> $GITHUB_STEP_SUMMARY
        fi

