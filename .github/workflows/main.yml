name: Build Android Kernel

on:
  push:
    branches: [ main, master, lotus-4.9.205 ]
    paths:
      - 'arch/**'
      - 'kernel/**'
      - 'lib/**'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    branches: [ main, master, lotus-4.9.205 ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Kernel config (r570e_defconfig)'
        required: true
        default: 'r570e_defconfig'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabihf \
          libncurses5-dev \
          libssl-dev \
          bc \
          bison \
          flex \
          libelf-dev \
          libdw-dev \
          python3 \
          git
    
    - name: Clean kernel tree
      run: |
        make mrproper || true
    
    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make ${{ github.event.inputs.config || 'r570e_defconfig' }}
    
    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
    
    - name: Build kernel modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) modules 2>&1 | tee -a build.log
    
    - name: Install modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p modules
        make modules_install INSTALL_MOD_PATH=./modules INSTALL_MOD_STRIP=1 2>&1 | tee -a build.log
    
    - name: Check build artifacts
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✓ Kernel image built successfully"
          ls -lh arch/arm64/boot/Image.gz-dtb
        else
          echo "✗ Kernel image not found"
          exit 1
        fi
        if [ -d modules/lib/modules ]; then
          echo "✓ Kernel modules built successfully"
          find modules/lib/modules -name "*.ko" | wc -l | xargs echo "Total .ko files:"
          du -sh modules/lib/modules
        else
          echo "⚠ Kernel modules directory not found"
        fi
    
    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image
          .config
        retention-days: 30
    
    - name: Create modules archive
      if: success()
      run: |
        if [ -d modules/lib/modules ]; then
          cd modules
          tar -czf ../kernel-modules.tar.gz lib/
          cd ..
          echo "✓ Modules archive created"
          ls -lh kernel-modules.tar.gz
        else
          echo "⚠ No modules to archive"
        fi
    
    - name: Upload kernel modules
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: |
          kernel-modules.tar.gz
          modules/lib/modules/
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
    
    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel Image:** \`arch/arm64/boot/Image.gz-dtb\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(ls -lh arch/arm64/boot/Image.gz-dtb | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check build log for details." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d modules/lib/modules ]; then
          MODULE_COUNT=$(find modules/lib/modules -name "*.ko" | wc -l)
          echo "**Kernel Modules:** ✅ ($MODULE_COUNT .ko files)" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Archive:** \`kernel-modules.tar.gz\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Kernel Modules:** ⚠ Not found" >> $GITHUB_STEP_SUMMARY
        fi

